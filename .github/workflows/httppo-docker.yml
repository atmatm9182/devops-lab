name: Docker Image Httppo

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build HTTPPO
      run: docker build ./httppo --file ./httppo/Dockerfile --tag httppo:$(date +%s)
